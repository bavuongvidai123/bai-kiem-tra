
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asian Restaurant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- LOGO -->
    <header>
        <a href="#">
            <img src="logo.png" alt="Asian Logo">
        </a>

        <!-- MENU -->
        <nav>
            <a href="#home">Home</a>
            <a href="#team">Menu</a>
            <a href="#banner2">Page</a>
            <a href="#contact">Category</a>
            <a href="#footer">About</a>
        </nav>
    </header>

    <!-- BANNER -->
    <section id="home">
        <a href="#team">
            <img src="banner.jpg" alt="Banner">
        </a>
    </section>

<!-- MEET OUR TEAM -->
<section id="team" class="team">
    <p class="subtitle">OUR CREATIVE FORCE</p>
    <h2><a href="#team">Meet our team</a></h2>

    <div class="team-grid">
        <div class="member">
            <a href="#team">
                <img src="member1.jpg" alt="Nick Mcallister">
            </a>
            <h3><a href="#team">Nick Mcallister</a></h3>
            <p>OWNER</p>
        </div>

        <div class="member">
            <a href="#team">
                <img src="member2.jpg" alt="Ralph Johnson">
            </a>
            <h3><a href="#team">Ralph Johnson</a></h3>
            <p>CUSTOMER CARE</p>
        </div>

        <div class="member">
            <a href="#team">
                <img src="member3.jpg" alt="Benj Spitch">
            </a>
            <h3><a href="#team">Benj Spitch</a></h3>
            <p>CO-FOUNDER</p>
        </div>

        <div class="member">
            <a href="#team">
                <img src="member4.jpg" alt="Tom Zafron">
            </a>
            <h3><a href="#team">Tom Zafron</a></h3>
            <p>SPECIALIST</p>
        </div>
    </div>
</section>

<!-- BANNER THU HAI -->
<section id="banner2" class="banner2">
    <a href="#contact">
        <img src="banner2.jpg" alt="Mon an">
    </a>
</section>

<!-- CONTACT US -->
<section id="contact" class="contact">
    <h2>Contact Us Now</h2>

    <form onsubmit="return checkEmail()">
        <input type="email" id="email"
               placeholder="Enter your email here...">
        <button type="submit">Send Email Contact</button>
    </form>
</section>

<script>
function checkEmail() {
    var email = document.getElementById("email").value.trim();

    if (email === "") {
        alert("Please enter your email!");
        return false;
    }

    alert("Email submitted successfully!");
    return false;
}
</script>

<!-- FOOTER -->
<footer id="footer">
    <div class="footer-content">
        <h2>Umeå</h2>
        <p>© 2023 All Rights Reserved</p>
    </div>
</footer>

</body>
</html>
